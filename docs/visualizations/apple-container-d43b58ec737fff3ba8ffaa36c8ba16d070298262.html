<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftMiner Diff</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#656d76; --add:#dafbe1; --del:#ffebe9; --accent:#0969da; --badge:#8250df; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --add:#12261e; --del:#301a1a; --accent:#58a6ff; --badge:#a371f7; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; color:inherit; }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px; min-height:58px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
    h1 { margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; }
    .summary { color:var(--muted); white-space:nowrap; }
    .view-toggle { display:flex; flex:none; margin-left:auto; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .view-toggle button { border:0; border-left:1px solid var(--line); padding:6px 10px; background:var(--panel); white-space:nowrap; cursor:pointer; }
    .view-toggle button:first-child { border-left:0; }
    .view-toggle button.active { color:#fff; background:var(--accent); }
    .layout { display:grid; grid-template-columns:300px minmax(0,1fr); min-height:calc(100vh - 59px); }
    aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto; }
    .aside-section { padding:12px; border-bottom:1px solid var(--line); }
    .aside-section h2 { margin:0 0 8px; color:var(--muted); font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
    .nav-list { display:grid; gap:4px; }
    .nav-button { width:100%; padding:7px 8px; border:0; border-radius:6px; background:transparent; text-align:left; cursor:pointer; }
    .nav-button:hover, .nav-button.active { background:color-mix(in srgb, var(--accent) 14%, transparent); }
    .nav-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nav-meta { display:block; color:var(--muted); font-size:12px; }
    .ref-id { display:inline-grid; place-items:center; min-width:20px; height:20px; margin-right:6px; border-radius:10px; color:#fff; background:var(--badge); font-size:11px; font-weight:700; }
    main { min-width:0; overflow:auto; }
    .file-header { padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
    .path-row { display:flex; align-items:center; gap:8px; min-width:0; }
    .path { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .status { flex:none; padding:2px 6px; border:1px solid var(--line); border-radius:10px; color:var(--muted); font-size:11px; text-transform:uppercase; }
    .warning { margin-top:7px; color:#9a6700; }
    .file-markers { display:inline-flex; gap:4px; margin-left:auto; }
    .diff { min-width:720px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .columns, .side-row { display:grid; grid-template-columns:52px minmax(0,1fr) 52px minmax(0,1fr); }
    .columns { border-bottom:1px solid var(--line); background:var(--panel); color:var(--muted); }
    .columns div { padding:6px 10px; border-right:1px solid var(--line); }
    .side-row { min-height:22px; border-bottom:1px solid color-mix(in srgb, var(--line) 35%, transparent); }
    .line-number { padding:2px 8px; border-right:1px solid var(--line); color:var(--muted); background:var(--panel); text-align:right; user-select:none; }
    .code-cell { display:flex; min-width:0; padding:2px 8px; border-right:1px solid var(--line); }
    .code-cell code { white-space:pre; }
    .empty { background:var(--panel); }
    .side-row.delete .before-code, .side-row.replace .before-code, .unified-line.delete { background:var(--del); }
    .side-row.insert .after-code, .side-row.replace .after-code, .unified-line.insert { background:var(--add); }
    .markers { display:inline-flex; align-items:flex-start; gap:2px; flex:none; margin-right:6px; }
    .marker { display:inline-grid; place-items:center; min-width:17px; height:17px; padding:0 4px; border:0; border-radius:9px; color:#fff; background:var(--badge); font:700 10px/1 sans-serif; cursor:pointer; }
    .unified-line { display:grid; grid-template-columns:52px 22px minmax(0,1fr); min-height:22px; border-bottom:1px solid color-mix(in srgb, var(--line) 35%, transparent); }
    .sign { padding:2px 5px; color:var(--muted); text-align:center; user-select:none; }
    .unified-code { display:flex; min-width:0; padding:2px 8px; }
    .unified-code code { white-space:pre; }
    .empty-state { padding:40px; color:var(--muted); text-align:center; }
    .tooltip { position:fixed; z-index:30; width:min(360px,calc(100vw - 24px)); padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); box-shadow:0 8px 30px rgba(0,0,0,.25); }
    .tooltip[hidden] { display:none; }
    .tooltip strong { display:block; margin-bottom:4px; }
    .tooltip div { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    @media (max-width:850px) { .layout { grid-template-columns:1fr; } aside { position:static; max-height:300px; border-right:0; border-bottom:1px solid var(--line); } .summary { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <div id="summary" class="summary"></div>
    <div class="view-toggle" role="group" aria-label="Diff layout">
      <button id="side-button" type="button">Side by side</button>
      <button id="unified-button" type="button">Unified</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <section class="aside-section"><h2>Changed files</h2><div id="files" class="nav-list"></div></section>
      <section class="aside-section"><h2>Refactorings</h2><div id="refactorings" class="nav-list"></div></section>
      <section id="unanchored-section" class="aside-section" hidden><h2>Unanchored refactorings</h2><div id="unanchored" class="nav-list"></div></section>
    </aside>
    <main><div id="content"></div></main>
  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script>
    'use strict';
    const encoded = document.getElementById('swiftminer-data').textContent.trim();
    const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    const model = JSON.parse(new TextDecoder().decode(bytes));
    const selection = new URLSearchParams(location.search).get('refactoring');
    const selectedID = selection == null ? null : Number(selection);
    let selectedRefactoring = null;
    if (selection != null) {
      selectedRefactoring = Number.isInteger(selectedID)
        ? model.refactorings.find(refactoring => refactoring.id === selectedID)
        : null;
      const activeIDs = new Set(selectedRefactoring ? [selectedRefactoring.id] : []);
      model.refactorings = selectedRefactoring ? [selectedRefactoring] : [];
      const selectedFiles = model.files.filter(file => file.refactoringIDs.some(id => activeIDs.has(id)));
      if (selectedFiles.length) model.files = selectedFiles;
      model.files.forEach(file => {
        file.refactoringIDs = file.refactoringIDs.filter(id => activeIDs.has(id));
        file.rows.forEach(row => {
          row.beforeMarkers = row.beforeMarkers.filter(id => activeIDs.has(id));
          row.afterMarkers = row.afterMarkers.filter(id => activeIDs.has(id));
        });
      });
      model.statistics.refactoringCount = selectedRefactoring ? 1 : 0;
      model.statistics.changedFileCount = model.files.length;
      model.statistics.anchoredRefactoringCount = selectedRefactoring?.anchors.length ? 1 : 0;
      model.statistics.unanchoredRefactoringCount = selectedRefactoring && !selectedRefactoring.anchors.length ? 1 : 0;
    }
    const byRef = new Map(model.refactorings.map(refactoring => [refactoring.id, refactoring]));
    let currentFileID = model.files.length ? model.files[0].id : null;
    let view = model.initialView;
    let pinnedRef = null;

    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    };
    const button = (className, text, action) => {
      const node = element('button', className, text);
      node.type = 'button';
      node.addEventListener('click', action);
      return node;
    };
    const displayPath = file => file.afterPath || file.beforePath || '(unknown file)';
    const refactoringText = refactoring => `${refactoring.name} · ${refactoring.category}`;

    document.getElementById('title').textContent = selectedRefactoring?.name || model.title;
    document.getElementById('summary').textContent = selection != null && !selectedRefactoring
      ? 'Selected refactoring is unavailable'
      : `${model.statistics.changedFileCount} files · ${model.statistics.refactoringCount} refactorings`;
    document.getElementById('side-button').addEventListener('click', () => setView('sideBySide'));
    document.getElementById('unified-button').addEventListener('click', () => setView('unified'));
    document.addEventListener('click', event => {
      if (!event.target.closest('.marker') && !event.target.closest('.tooltip')) {
        pinnedRef = null;
        document.getElementById('tooltip').hidden = true;
      }
    });

    function setView(next) {
      view = next;
      renderViewButtons();
      renderCurrentFile();
    }

    function renderViewButtons() {
      document.getElementById('side-button').classList.toggle('active', view === 'sideBySide');
      document.getElementById('unified-button').classList.toggle('active', view === 'unified');
    }

    function renderFiles() {
      const list = document.getElementById('files');
      list.replaceChildren();
      model.files.forEach(file => {
        const item = button('nav-button', null, () => selectFile(file.id));
        item.classList.toggle('active', file.id === currentFileID);
        item.append(element('span', 'nav-title', displayPath(file)));
        item.append(element('span', 'nav-meta', `${file.kind} · ${file.refactoringIDs.length} refactorings`));
        list.append(item);
      });
    }

    function renderRefactoringLists() {
      const anchored = document.getElementById('refactorings');
      const unanchored = document.getElementById('unanchored');
      anchored.replaceChildren();
      unanchored.replaceChildren();
      model.refactorings.forEach(refactoring => {
        const item = button('nav-button', null, () => jumpToRefactoring(refactoring));
        item.append(element('span', 'ref-id', refactoring.id));
        item.append(element('span', 'nav-title', refactoring.name));
        item.append(element('span', 'nav-meta', refactoring.category));
        (refactoring.anchors.length ? anchored : unanchored).append(item);
      });
      document.getElementById('unanchored-section').hidden = !unanchored.childElementCount;
      if (!anchored.childElementCount) anchored.append(element('div', 'nav-meta', 'No anchored refactorings'));
    }

    function selectFile(fileID, refID) {
      currentFileID = fileID;
      renderFiles();
      renderCurrentFile();
      if (refID) requestAnimationFrame(() => {
        document.querySelector(`.marker[data-ref="${refID}"]`)?.scrollIntoView({block:'center', inline:'center'});
      });
    }

    function jumpToRefactoring(refactoring) {
      const anchor = refactoring.anchors[0];
      if (anchor) selectFile(anchor.fileID, refactoring.id);
    }

    function renderCurrentFile() {
      const content = document.getElementById('content');
      content.replaceChildren();
      const file = model.files.find(candidate => candidate.id === currentFileID);
      if (!file) {
        content.append(element('div', 'empty-state', 'No changed Swift files.'));
        return;
      }
      content.append(renderFileHeader(file));
      content.append(view === 'sideBySide' ? renderSideBySide(file) : renderUnified(file));
    }

    function renderFileHeader(file) {
      const header = element('div', 'file-header');
      const row = element('div', 'path-row');
      row.append(element('span', 'status', file.kind));
      const path = file.beforePath && file.afterPath && file.beforePath !== file.afterPath
        ? `${file.beforePath} → ${file.afterPath}` : displayPath(file);
      row.append(element('span', 'path', path));
      const fileMarkers = element('span', 'file-markers');
      file.refactoringIDs.forEach(id => fileMarkers.append(marker(id)));
      row.append(fileMarkers);
      header.append(row);
      if (file.simplified) header.append(element('div', 'warning', 'Large changed region: showing a simplified delete/add diff.'));
      return header;
    }

    function renderSideBySide(file) {
      const diff = element('div', 'diff');
      const columns = element('div', 'columns');
      columns.append(element('div', null, 'Old'));
      columns.append(element('div', null, file.beforePath || 'Before'));
      columns.append(element('div', null, 'New'));
      columns.append(element('div', null, file.afterPath || 'After'));
      diff.append(columns);
      file.rows.forEach(row => {
        const line = element('div', `side-row ${row.kind}`);
        appendSide(line, row.beforeLine, row.beforeText, row.beforeMarkers, 'before-code');
        appendSide(line, row.afterLine, row.afterText, row.afterMarkers, 'after-code');
        diff.append(line);
      });
      return diff;
    }

    function appendSide(row, lineNumber, text, markerIDs, sideClass) {
      row.append(element('div', `line-number ${lineNumber == null ? 'empty' : ''}`, lineNumber));
      const cell = element('div', `code-cell ${sideClass} ${text == null ? 'empty' : ''}`);
      cell.append(markers(markerIDs));
      cell.append(element('code', null, text));
      row.append(cell);
    }

    function renderUnified(file) {
      const diff = element('div', 'diff');
      file.rows.forEach(row => {
        if (row.kind === 'equal') {
          diff.append(unifiedLine('equal', ' ', row.afterLine ?? row.beforeLine, row.afterText ?? row.beforeText, [...new Set([...row.beforeMarkers, ...row.afterMarkers])]));
        } else {
          if (row.beforeLine != null) diff.append(unifiedLine('delete', '−', row.beforeLine, row.beforeText, row.beforeMarkers));
          if (row.afterLine != null) diff.append(unifiedLine('insert', '+', row.afterLine, row.afterText, row.afterMarkers));
        }
      });
      return diff;
    }

    function unifiedLine(kind, sign, lineNumber, text, markerIDs) {
      const row = element('div', `unified-line ${kind}`);
      row.append(element('div', 'line-number', lineNumber));
      row.append(element('div', 'sign', sign));
      const code = element('div', 'unified-code');
      code.append(markers(markerIDs));
      code.append(element('code', null, text));
      row.append(code);
      return row;
    }

    function markers(ids) {
      const list = element('span', 'markers');
      ids.forEach(id => list.append(marker(id)));
      return list;
    }

    function marker(id) {
      const node = element('button', 'marker', id);
      node.type = 'button';
      node.dataset.ref = id;
      node.setAttribute('aria-label', `Show refactoring ${id}`);
      node.addEventListener('mouseenter', () => { if (pinnedRef == null) showTooltip(id, node); });
      node.addEventListener('mouseleave', () => { if (pinnedRef == null) document.getElementById('tooltip').hidden = true; });
      node.addEventListener('focus', () => showTooltip(id, node));
      node.addEventListener('blur', () => { if (pinnedRef == null) document.getElementById('tooltip').hidden = true; });
      node.addEventListener('click', event => {
        event.stopPropagation();
        pinnedRef = pinnedRef === id ? null : id;
        if (pinnedRef == null) document.getElementById('tooltip').hidden = true;
        else showTooltip(id, node);
      });
      return node;
    }

    function showTooltip(id, target) {
      const refactoring = byRef.get(id);
      if (!refactoring) return;
      const tooltip = document.getElementById('tooltip');
      tooltip.replaceChildren();
      tooltip.append(element('strong', null, `#${id} ${refactoring.name}`));
      tooltip.append(element('div', null, `Category: ${refactoring.category} · Type: ${refactoring.caseName}`));
      refactoring.anchors.forEach(anchor => {
        const range = anchor.startLine == null ? 'file level'
          : anchor.startLine === anchor.endLine ? `line ${anchor.startLine}`
          : `lines ${anchor.startLine}–${anchor.endLine}`;
        tooltip.append(element('div', null, `${anchor.side}: ${anchor.path} · ${range}`));
      });
      tooltip.hidden = false;
      const rect = target.getBoundingClientRect();
      const left = Math.min(window.innerWidth - tooltip.offsetWidth - 12, Math.max(12, rect.left));
      const top = rect.bottom + tooltip.offsetHeight + 12 < window.innerHeight
        ? rect.bottom + 7 : Math.max(12, rect.top - tooltip.offsetHeight - 7);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    renderViewButtons();
    renderFiles();
    renderRefactoringLists();
    renderCurrentFile();
    if (selectedRefactoring) jumpToRefactoring(selectedRefactoring);
    window.parent?.postMessage({type:'swiftminer-visualization-ready'}, '*');
  </script>
</body>
</html>
